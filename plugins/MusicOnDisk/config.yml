# ===================================
# MusicOnDisk Configuration v1.0.0
# ===================================
# A professional custom music disc plugin
# Documentation: https://github.com/musicondisk/MusicOnDisk

# ---- Audio Processing ----
audio:
  # Maximum song duration in seconds (default: 600 = 10 minutes, 3600 = 1 hour)
  max-duration: 600
  # Maximum file size in MB
  max-file-size: 10
  # Maximum concurrent downloads
  max-concurrent-downloads: 3
  # Temp directory cleanup interval in minutes
  temp-cleanup-interval: 30
  # Audio quality (best, worst, or specific number like 192)
  audio-quality: best
  # Allowed URL domains (leave empty to allow all)
  allowed-domains:
    - youtube.com
    - youtu.be
    - www.youtube.com
    - music.youtube.com

# ---- Tool Installer ----
tool-installer:
  enabled: true
  auto-download: true
  verify-checksums: true
  download-timeout-seconds: 120
  retry-attempts: 3
  delete-temp-files: true
  use-global-tools-first: true

# ---- FFmpeg Settings ----
ffmpeg:
  # Path to ffmpeg binary (leave empty for auto-detection)
  path: ""
  # Path to yt-dlp binary (leave empty for auto-detection)
  yt-dlp-path: ""
  # Output sample rate
  sample-rate: 44100
  # Output channels (1=mono like vanilla music discs, 2=stereo)
  channels: 1
  # Output bitrate (e.g., 128k, 192k)
  bitrate: 128k

# ---- Resource Pack Settings ----
# The plugin auto-detects your public IP and tests if the pack URL is externally reachable.
# If direct hosting fails (home server / NAT / firewall), the tunnel fallback activates.
resourcepack:

  # Public address used to build the resource pack download URL.
  # Set to "auto" to detect automatically (recommended for most servers).
  # Set to an explicit IP or hostname to skip detection entirely.
  # Examples:
  #   public-address: auto
  #   public-address: 203.0.113.5
  #   public-address: play.mineserver.com
  public-address: auto

  # HTTP server port for hosting the resource pack ZIP.
  # Must be open in your firewall / port-forwarded if using direct hosting.
  port: 8765

  # Force players to accept the resource pack
  force: true

  # Kick players who decline the resource pack
  kick-on-decline: false

  # Description shown in the resource pack prompt
  description: "MusicOnDisk Custom Sounds"

  # ---- Tunnel Settings ----
  # When your public endpoint is not reachable (home server, Pterodactyl without port
  # forwarding, etc.), the plugin can start a tunnel to expose the pack server.
  tunnel:
    # Master switch — set to false to disable tunnel completely
    enabled: true

    # Which tunnel provider to use. Currently supported: ngrok
    # Future providers: cloudflare, localxpose
    provider: ngrok

    # Automatically start the tunnel when direct IP reachability fails
    autostart: true

    ngrok:
      # Your ngrok authentication token.
      # Required — without it, the ngrok tunnel will not start.
      # Get one free at: https://dashboard.ngrok.com/get-started/your-authtoken
      # Then paste it below:
      auth-token: "3D1brevVSrOzBcwD56GHW2fV2tV_3W5XrMPPeSubF6ekfjeSN"

    cloudflare:
      # Placeholder for future Cloudflare Tunnel support (not yet implemented)
      enabled: false


# ---- Jukebox (custom discs) ----
jukebox:
  # Max blocks from the jukebox center where this disc is heard. Set to 64 to match default Minecraft disc sound range.
  sound-radius: 128
  # Base disc loudness. Default 1.0 matches vanilla Minecraft disc volume.
  volume: 1.0
  # Ticks to wait after inserting a disc before starting custom audio (20 ticks = 1 second).
  playback-delay: 5
  # true = short "now playing" line above the hotbar when music starts.
  show-action-bar: true

  # ---- Proximity Resource Pack ----
  # Players will receive the resource pack ONLY when they walk within this
  # many blocks of any placed Jukebox. This replaces the old behaviour of
  # pushing the pack to every player whenever a new disc is created.
  # Default: 4 blocks (configurable).
  pack-send-radius: 4

  # How often (in ticks) to scan whether players are near a jukebox.
  # 40 ticks = 2 seconds. Lower = more responsive, higher = less CPU.
  pack-send-interval-ticks: 40


# ---- Cooldowns ----
cooldowns:
  # Cooldown in seconds between disc creation requests
  create: 30
  # Cooldown in seconds between give commands
  give: 5

# ---- Messages ----
messages:
  prefix: "<gradient:#6ee7f7:#a78bfa><bold>MusicOnDisk</bold></gradient> <dark_gray>»</dark_gray> "
  no-permission: "<red>You don't have permission to do that.</red>"
  player-only: "<red>This command can only be used by players.</red>"
  disc-not-found: "<red>No music disc found with ID: <yellow><id></yellow></red>"
  player-not-found: "<red>Player not found: <yellow><player></yellow></red>"
  invalid-url: "<red>Invalid URL. Please provide a valid YouTube URL.</red>"
  domain-not-allowed: "<red>That domain is not allowed. Allowed domains: <yellow><domains></yellow></red>"
  song-too-long: "<red>Song is too long. Maximum duration is <yellow><max></yellow> seconds.</red>"
  download-started: "<green>Download started! This may take a moment...</green>"
  download-failed: "<red>Failed to download audio. Please try again.</red>"
  download-success: "<green>✓ Music disc '<gold><name></gold>' created successfully!</green>"
  disc-given: "<green>✓ Gave '<gold><name></gold>' disc to <yellow><player></yellow>.</green>"
  disc-deleted: "<green>✓ Music disc '<gold><name></gold>' deleted successfully.</green>"
  plugin-reloaded: "<green>✓ MusicOnDisk reloaded successfully.</green>"
  pack-rebuilt: "<green>✓ Resource pack rebuilt successfully.</green>"
  no-discs: "<yellow>No music discs have been created yet.</yellow>"
  cooldown: "<red>Please wait <yellow><time></yellow> seconds before using this command again.</red>"
  playing-music: "<gradient:#6ee7f7:#a78bfa>♪ Now Playing: <white><name></white></gradient>"
  stopped-music: "<gray>♪ Music stopped.</gray>"
  stopped-music-reload: "<gray>♪ Music stopped on pack reload.</gray>"
  queue-full: "<red>The download queue is full. Please try again later.</red>"
  processing: "<yellow>⏳ Processing your request... This may take a few moments.</yellow>"
  inventory-full: "<yellow>Your inventory is full! The disc was dropped at your feet.</yellow>"

# ---- GUI Settings ----
gui:
  disc-browser-title: "<gradient:#6ee7f7:#a78bfa>Music Disc Browser</gradient>"
  admin-panel-title: "<gradient:#f97316:#ef4444>Admin Panel</gradient>"
  items-per-page: 27
  # Border item material
  border-material: BLACK_STAINED_GLASS_PANE
  # Navigation arrow materials
  prev-page-material: ARROW
  next-page-material: ARROW

# ---- Database ----
database:
  # Database file name (stored in plugin folder)
  file: musicondisk.db

# ---- Logging ----
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: INFO
  # Log downloads to file
  log-downloads: true
  # Log file name
  log-file: musicondisk.log

